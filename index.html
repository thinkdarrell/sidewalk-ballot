<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>Scan to Vote — Sidewalk 28 Ballot</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --card:#131315; --edge:#2a2a2e; --ink:#fafaf6;
  --dim:#9a9aa0; --yellow:#fffd67; --coral:#f3827f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  min-height:100svh; display:flex; align-items:center; justify-content:center;
  padding:20px 16px;
  background-image:radial-gradient(120% 90% at 50% 0%, #17171a 0%, var(--bg) 60%);
}
a{color:inherit}
.stub{
  width:100%; max-width:460px; background:var(--card);
  border:1px solid var(--edge); border-radius:14px; overflow:hidden;
  animation:rise .45s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stub{animation:none}}
.stub-head{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:14px 22px 12px; border-bottom:1px solid var(--edge);
  font-size:11px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase;
  font-weight:600;
}
.stub-head .fest{color:var(--yellow)}
.bill{padding:28px 22px 18px; text-align:center}
.eyebrow{
  font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--dim); font-weight:600; margin-bottom:14px;
}
h1{
  font-stretch:66%; font-weight:800; text-transform:uppercase;
  line-height:.98; letter-spacing:.01em; overflow-wrap:anywhere;
  margin-bottom:16px;
}
h1.t-s{font-size:44px}
h1.t-m{font-size:34px}
h1.t-l{font-size:26px}
.when{
  display:inline-block; font-size:13px; font-weight:600; letter-spacing:.08em;
  color:var(--ink); border:1px solid var(--edge); border-radius:999px;
  padding:6px 14px; margin:0 3px 4px;
}
.ballot{padding:4px 18px 24px; text-align:left}
.scalekey{
  text-align:center; font-size:11px; line-height:1.9;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  padding:8px 2px 14px; font-weight:600;
}
.film{margin-bottom:18px}
.film h3{font-size:15px; font-weight:700; margin-bottom:8px; overflow-wrap:anywhere}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:7px}
.scale button{
  height:46px; font:inherit; font-weight:700; font-size:16px;
  background:none; border:1px solid var(--edge); border-radius:8px;
  color:var(--ink); cursor:pointer;
}
.scale button.sel{background:var(--yellow); border-color:var(--yellow); color:#0b0b0c}
.scale button:focus-visible{outline:3px solid var(--coral); outline-offset:2px}
.cast{
  display:block; width:100%; margin-top:22px;
  background:var(--yellow); color:#0b0b0c; border:0; cursor:pointer;
  font-family:inherit; font-stretch:72%; font-weight:800; text-transform:uppercase;
  font-size:22px; letter-spacing:.05em; padding:20px 16px; border-radius:10px;
}
.cast:disabled{background:#3a3a40; color:#77777d; cursor:default}
.cast:not(:disabled):active{transform:translateY(1px)}
.vote{
  display:block; background:var(--yellow); color:#0b0b0c; text-decoration:none;
  font-stretch:72%; font-weight:800; text-transform:uppercase; text-align:center;
  font-size:22px; letter-spacing:.05em; padding:20px 16px; border-radius:10px;
}
.thanks{padding:36px 22px 40px; text-align:center}
.thanks h2{
  font-stretch:66%; font-weight:800; text-transform:uppercase;
  font-size:34px; color:var(--yellow); margin-bottom:10px;
}
.thanks p{font-size:14px; color:var(--dim)}
.fallback{text-align:center; padding:0 22px 20px}
.fallback a{color:var(--yellow)}
.vote:focus-visible,.cast:focus-visible,.support a:focus-visible,
.site:focus-visible,.fallback a:focus-visible{
  outline:3px solid var(--coral); outline-offset:3px;
}
.hint{font-size:13px; color:var(--dim); margin-top:12px; margin-bottom:18px}
.perf{position:relative; border-top:2px dashed #3a3a40; margin:0 -1px}
.perf::before,.perf::after{
  content:""; position:absolute; top:-11px; width:20px; height:20px;
  border-radius:50%; background:var(--bg); border:1px solid var(--edge);
}
.perf::before{left:-11px}
.perf::after{right:-11px}
.support{padding:24px 22px 26px; text-align:center}
.support h2{
  font-stretch:72%; font-weight:800; text-transform:uppercase;
  font-size:16px; letter-spacing:.06em; color:var(--coral); margin-bottom:8px;
}
.support p{font-size:14px; color:var(--dim); line-height:1.5; margin-bottom:18px}
.support .row{display:flex; gap:10px}
.support .row a{
  flex:1; display:block; text-decoration:none; font-weight:700; font-size:14px;
  padding:13px 8px; border-radius:8px; border:1px solid var(--edge); color:var(--ink);
}
.support .row a.donate{border-color:var(--coral); color:var(--coral)}
.site{
  display:block; text-align:center; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim); text-decoration:none;
  padding:14px; border-top:1px solid var(--edge);
}
</style>
</head>
<body>
<main class="stub">
<div class="stub-head"><span class="fest">Sidewalk 28</span><span>Admit One</span></div>
<div class="bill">
<p class="eyebrow">Audience Ballot</p>
<h1 class="t-m">Scan to Vote</h1>
<p class="hint">Each screening has its own ballot QR — scan the one on screen to vote.</p>
</div>
<a class="site" href="https://sidewalkfest.com/">sidewalkfest.com</a>
</main>
</body>
</html>
